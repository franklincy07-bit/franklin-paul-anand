# Homepage supporting statement (approved, owner's wording).
supportingStatement: I'm a development leader working at the intersection of strategic leadership, organisational development and social impact. More than 15 years of experience in programme leadership, organisational performance, monitoring and learning, youth development and partnerships have shaped my approach to strengthening organisations and enabling meaningful social impact.

# Short bio for the home page sidebar.
shortBio:
  - I'm Franklin. For over 15 years I've worked in international development – from community-level programme work in Bihar to my current role as Head of Country for India and Nepal.
  - Youth leadership has been at the heart of that journey, and it shapes how I think about building organisations that deliver.

# About page introduction (three paragraphs).
aboutIntro:
  - I'm a development leader working at the intersection of strategic leadership, organisational development and social impact. As Head of Country for India and Nepal, I lead strategic planning, operational planning and organisational performance across my country leadership responsibilities, working closely with the leadership team and the organisation's governance structures.
  - My perspective was built from the ground up. I began with community-level programme work in Bihar, recruiting and supporting community volunteers. I then spent a decade building monitoring, evaluation and learning systems across several Indian states and multi-country programmes in Asia and Africa, before moving into strategic and organisational leadership. Along the way I've worked with government, UN agencies, the private sector, NGOs and research institutions, and supported programme partners to strengthen their monitoring and learning practices.
  - Working alongside young people taught me that lasting impact needs more than good programmes. It needs clear strategy, strong organisations, sound evidence and partnerships that outlast any single project. That is the work I care about most – helping organisations strengthen their capabilities and turn strategy into meaningful change, with youth leadership as a distinctive part of it.

# The five areas of expertise (approved). `topic` must match a topic key.
expertise:
  - topic: strategic-leadership
    summary: Turning strategy into action through planning, performance and leadership.
    details:
      - points:
          - Annual strategic planning and review against country strategy
          - Leading and working with the leadership team
          - Organisational performance reporting to leadership and governance structures
          - Contributing to organisational strategy at a global level
  - topic: organisational-development
    summary: Strengthening the systems, processes and teams that help organisations deliver.
    details:
      - heading: Within my own organisation
        points:
          - Operational plans across business units
          - Performance dashboards covering quality assurance, risk, management accounts and internal audit
          - Programme management, risk, safety and security systems
          - Team development, mentoring and building capacity
      - heading: With programme partners
        points:
          - Technical support to strengthen monitoring, evaluation and learning practices
      - heading: Digital systems and tools
        points:
          - Digital platforms, real-time dashboards and mobile applications
  - topic: social-impact
    summary: Designing programmes and partnerships that create change beyond any single project.
    details:
      - points:
          - Programme strategy informed by evidence and learning
          - Multi-country initiatives across Asia and Africa
          - Partnerships with government, UN agencies, the private sector, NGOs and research institutions
  - topic: youth-leadership
    summary: Advancing young people as leaders, decision-makers and agents of change.
    details:
      - points:
          - Over 15 years in youth-led development
          - Youth-led monitoring tools and youth-led reviews
          - Test-learn-adapt cycles led by young people
  - topic: evidence-learning
    summary: Using evidence to improve decisions, accountability and results.
    details:
      - points:
          - Monitoring, evaluation and learning frameworks, baselines and evaluations
          - Outcome mapping, adaptive management and value-for-money assessment
          - Results reporting and research partnerships

